const fmt = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });

// ---------- recorte das peças (remove o fundo de papel e a faixa laranja) ----------
const imgCache = new Map();
function loadImage(src) {
  if (!imgCache.has(src)) imgCache.set(src, new Promise((res, rej) => {
    const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src;
  }));
  return imgCache.get(src);
}
function isBg(r, g, b) {
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), sat = mx - mn;
  if (mx >= 140 && mx <= 247 && sat < 34) return true;              // papel texturizado e sombra
  if (r > 195 && g > 100 && g < 200 && b < 160 && r - b > 60) return true; // faixa laranja
  return false;
}
function cutPiece(im, box, mirror) {
  const W = im.naturalWidth, H = im.naturalHeight, m = 0.012;
  const x0 = Math.max(0, Math.floor((box[0] - m) * W)), y0 = Math.max(0, Math.floor((box[1] - m) * H));
  const x1 = Math.min(W, Math.ceil((box[0] + box[2] + m) * W)), y1 = Math.min(H, Math.ceil((box[1] + box[3] + m) * H));
  const w = x1 - x0, h = y1 - y0;
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  if (mirror) { cx.translate(w, 0); cx.scale(-1, 1); }
  cx.drawImage(im, x0, y0, w, h, 0, 0, w, h);
  const d = cx.getImageData(0, 0, w, h), p = d.data;
  const seen = new Uint8Array(w * h), stack = [];
  const push = (x, y) => { const i = y * w + x; if (!seen[i]) { seen[i] = 1; const k = i * 4; if (isBg(p[k], p[k+1], p[k+2])) { p[k+3] = 0; stack.push(i); } } };
  for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
  for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
  while (stack.length) {
    const i = stack.pop(), x = i % w, y = (i - x) / w;
    if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y);
    if (y > 0) push(x, y - 1); if (y < h - 1) push(x, y + 1);
  }
  // cor média da barra (para as costas lisas)
  let r = 0, g = 0, b = 0, n = 0;
  for (let y = Math.floor(h * 0.75); y < h * 0.92; y += 2) for (let x = Math.floor(w * 0.3); x < w * 0.7; x += 2) {
    const k = (y * w + x) * 4; if (p[k+3]) { r += p[k]; g += p[k+1]; b += p[k+2]; n++; }
  }
  cx.setTransform(1, 0, 0, 1, 0, 0);
  cx.putImageData(d, 0, 0);
  return { canvas: cv, w: box[2] + 2 * m, h: box[3] + 2 * m, color: n ? [r / n, g / n, b / n] : [40, 40, 40] };
}
function plainBack(front) {
  // mesma silhueta da frente, espelhada, preenchida com a cor da camisa
  const s = front.canvas, cv = document.createElement("canvas"); cv.width = s.width; cv.height = s.height;
  const cx = cv.getContext("2d");
  cx.translate(s.width, 0); cx.scale(-1, 1); cx.drawImage(s, 0, 0);
  cx.setTransform(1, 0, 0, 1, 0, 0);

  const [r, g, b] = front.color; cx.fillStyle = `rgb(${r|0},${g|0},${b|0})`; cx.fillRect(0, 0, cv.width, cv.height);

}

const RX = 0.34, RZ = 0.21;

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
function radii(v) { // perfil do tronco: ombros fecham em direção ao pescoço, barra abre um pouco

  return [RX * (1 - 0.36 * f) * (1 + 0.05 * (1 - v)), RZ * (1 - 0.72 * f) * (1 + 0.04 * (1 - v))];
}
function panel(H, back, scale) {
  const su = 48, sv = 40, pos = [], uv = [], idx = [];
  for (let j = 0; j <= sv; j++) {
    const v = j / sv, [rx, rz] = radii(v);
    for (let i = 0; i <= su; i++) {
      const u = i / su, th = back ? Math.PI / 2 + u * Math.PI : -Math.PI / 2 + u * Math.PI;
      pos.push(rx * Math.sin(th) * scale, (v - 0.5) * H, rz * Math.cos(th) * scale);
      uv.push(u, v);
    }
  }
  for (let j = 0; j < sv; j++) for (let i = 0; i < su; i++) {
    const a = j * (su + 1) + i, b = a + 1, c = a + su + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();

  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));

}
function sleeve(circ, len, side) {
  const r = circ / (2 * Math.PI), su = 40, sv = 16, pos = [], uv = [], idx = [];
  for (let j = 0; j <= sv; j++) {
    const v = j / sv;                       // v=1 topo (cabeça da manga)

    const a = j * (su + 1) + i, b = a + 1, c = a + su + 1, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();

  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx); g.computeVertexNormals();
  return g;
}
function texMat(piece) {

  t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return new THREE.MeshStandardMaterial({ map: t, side: THREE.DoubleSide, alphaTest: 0.5, roughness: 0.82 });
}

function mannequin(H, armAngle, sleeveLen) {
  const g = new THREE.Group();
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, H * 0.98, 40, 1, true), skin);
  torso.scale.set(RX * 0.93, 1, RZ * 0.9); g.add(torso);
  const top = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2), skin);
  top.scale.set(RX * 0.93, 0.12, RZ * 0.9); top.position.y = H * 0.49; g.add(top);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.075, 0.085, 0.22, 24), skin);
  neck.position.y = H / 2 + 0.07; g.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.16, 32, 24), skin);
  head.scale.set(1, 1.22, 1.05); head.position.y = H / 2 + 0.33; g.add(head);
  for (const s of [-1, 1]) {
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(0.062, Math.max(0.55, sleeveLen + 0.25), 8, 16), skin);
    const len = Math.max(0.55, sleeveLen + 0.25);
    const piv = new THREE.Group(); piv.position.set(s * RX * 0.86, H * 0.36, 0); piv.rotation.z = s * armAngle;
    arm.position.y = -len / 2 - 0.02; piv.add(arm); g.add(piv);
  }
  const hips = new THREE.Mesh(new THREE.CylinderGeometry(RX * 0.95, RX * 0.85, 0.18, 32), skin);
  hips.scale.set(1, 1, RZ / RX); hips.position.y = -H / 2 - 0.07; g.add(hips);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.025, 0.6, 12), steel);
  pole.position.y = -H / 2 - 0.45; g.add(pole);
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.36, 0.05, 40), steel);
  base.position.y = -H / 2 - 0.76; g.add(base);
  return g;
}

function dress(front, back, sl, sr) {
  // escala comum: a largura da frente vira meia volta do tronco
  const S = HALF / front.w, H = front.h * S;
  const scaleBack = back ? (back.w * S) / HALF : 1;
  const sleeveLen = sl ? sl.h * S : 0;
  const armAngle = sl ? (sleeveLen > 0.6 ? 0.12 : 0.32) : 0.12;
  const g = mannequin(H, armAngle, sleeveLen);
  g.add(new THREE.Mesh(panel(H, false, 1), texMat(front)));
  if (back) g.add(new THREE.Mesh(panel(back.h * S, true, Math.min(1.06, Math.max(0.94, scaleBack))), texMat(back)));
  if (sl && sr) {
    for (const [p, s] of [[sl, -1], [sr, 1]]) {
      const piv = new THREE.Group(); piv.position.set(s * RX * 0.86, H * 0.36 + 0.06, 0); piv.rotation.z = s * armAngle;
      const m = new THREE.Mesh(sleeve(p.w * S, p.h * S, s), texMat(p)); m.rotation.y = s * Math.PI / 2; piv.add(m); g.add(piv);
    }
  }
  return { group: g, H };
}

function clearFigure() {
  if (!figure) return;
  figure.traverse(o => { if (o.isMesh) { o.geometry.dispose(); if (o.material.map) { o.material.map.dispose(); o.material.dispose(); } } });
  scene.remove(figure); figure = null;
}

async function show(p) {
  $("pCat").textContent = p.categoria;
  $("pName").textContent = p.nome;
  $("pPrice").innerHTML = fmt.format(p.preco) + "<small>arquivo digital</small>";
  const [label, note] = TEXTOS[p.layout];
  $("pBadge").textContent = label; $("pBadge").classList.toggle("flat2d", p.layout === "foto");
  $("pNote").textContent = note;
  $("pOrig").src = p.img; $("pOrig").alt = "Arte original: " + p.nome;
  document.querySelectorAll(".pick button").forEach(b => b.setAttribute("aria-current", String(+b.dataset.id === p.id)));

  const is3d = p.layout !== "foto";
  canvas.hidden = !is3d; $("controls").hidden = !is3d; $("hint").hidden = !is3d;
  $("flat").hidden = is3d;
  clearFigure();
  if (!is3d) { $("flatImg").src = p.img; $("flatImg").alt = p.nome; $("loading").hidden = true; return; }

  $("loading").hidden = false;
  const im = await loadImage(p.img);
  const P = p.pecas;
  const root = new THREE.Group();
  if (p.layout === "molde") {
    const f = cutPiece(im, P.frente), b = cutPiece(im, P.costas);
    const l = cutPiece(im, P.manga_esq), r = cutPiece(im, P.manga_dir);
    root.add(dress(f, b, l, r).group);
  } else if (p.layout === "so_frente") {
    const f = cutPiece(im, P.frente);
    root.add(dress(f, plainBack(f)).group);
  } else if (p.layout === "kit") {
    const f1 = cutPiece(im, P.frente), f2 = cutPiece(im, P.frente_2);
    const a = dress(f1, plainBack(f1)).group, c = dress(f2, plainBack(f2)).group;
    a.position.x = -0.5; c.position.x = 0.48; c.scale.setScalar(0.8); c.position.y = -0.26;
    root.add(a, c);
  }
  // centraliza a figura no palco
  const box = new THREE.Box3().setFromObject(root), ctr = box.getCenter(new THREE.Vector3());
  root.position.y -= ctr.y - 0.05;
  figure = root; scene.add(root);
  const wide = p.layout === "kit";
  controls.minDistance = wide ? 3.2 : 2.2;
  camera.position.set(0, 0.25, wide ? 5.6 : 4.4); controls.target.set(0, 0.15, 0); controls.update();
  $("loading").hidden = true;
}

function face(angle) {
  const d = camera.position.distanceTo(controls.target);
  const y = camera.position.y;
  const r = Math.sqrt(Math.max(0.01, d * d - (y - controls.target.y) ** 2));
  camera.position.set(Math.sin(angle) * r, y, Math.cos(angle) * r);
  setSpin(false);
}
function setSpin(on) {
  controls.autoRotate = on;
  $("bSpin").setAttribute("aria-pressed", String(on));
  $("bSpin").textContent = on ? "Girando" : "Girar";
}
$("bFront").onclick = () => face(0);
$("bBack").onclick = () => face(Math.PI);
$("bSpin").onclick = () => setSpin(!controls.autoRotate);
canvas.addEventListener("pointerdown", () => setSpin(false));

function resize() {
  const r = $("stage").getBoundingClientRect();
  if (!r.width || !r.height) return;
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe($("stage"));
resize();
(function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();

// faixa de produtos
const pick = $("pick");
for (const p of PRODUTOS) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.id = p.id; b.setAttribute("role", "listitem");
  b.innerHTML = `<img src="${p.img}" alt="" loading="lazy"><span>${p.categoria}</span>`;
  b.title = p.nome;
  b.onclick = () => show(p).catch(() => { $("loading").textContent = "Não foi possível carregar esta arte."; });
  pick.appendChild(b);
}
setSpin(!reduced);
show(PRODUTOS[0]).catch(() => { $("loading").textContent = "Não foi possível carregar esta arte."; });
</script>
